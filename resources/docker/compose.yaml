# Test databases for every Cycle package. From a consumer repo:
#   docker compose -f vendor/cycle/testing/resources/docker/compose.yaml up -d --wait [mysql|postgres|sqlserver]
# Defaults come from the .env next to this file; exported DB_* variables override them.
# `--wait` returns once the healthchecks pass, so no wait loop is needed.
name: cycle-testing

services:
  mysql:
    image: ${DB_MYSQL_IMAGE}
    command: ${DB_MYSQL_COMMAND}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_MYSQL_PASSWORD}
      MYSQL_DATABASE: ${DB_MYSQL_DATABASE}
    ports:
      - "${DB_MYSQL_PORT}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  postgres:
    image: ${DB_POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${DB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_POSTGRES_DATABASE}
    ports:
      - "${DB_POSTGRES_PORT}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 40

  sqlserver:
    image: ${DB_SQLSERVER_IMAGE}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SQLSERVER_PASSWORD}
    ports:
      - "${DB_SQLSERVER_PORT}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U SA -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
